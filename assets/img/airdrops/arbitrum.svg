    <path d="M45 90 64 40l19 50" stroke="#ffffff" stroke-width="9"/>
    <path d="M72 74h-16" stroke="#12182a" stroke-width="9"/>
    <path d="M83 90 96 62" stroke="#28a0f0" stroke-width="8"/>
    <path d="M45 90 32 62" stroke="#28a0f0" stroke-width="8"/>
