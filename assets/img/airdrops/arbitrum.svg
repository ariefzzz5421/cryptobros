<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Arbitrum">
  <title>Arbitrum</title>
  <defs>
    <linearGradient id="arb-face" x1="18" y1="16" x2="110" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b3a56"/>
      <stop offset="1" stop-color="#12182a"/>
    </linearGradient>
  </defs>
  <!-- hexagonal token body -->
  <path d="M64 6 112 34v60L64 122 16 94V34z" fill="url(#arb-face)" stroke="#8fa4c8" stroke-opacity=".38" stroke-width="2"/>
