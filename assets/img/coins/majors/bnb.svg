<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="BNB">
  <title>BNB</title>
  <circle cx="32" cy="32" r="32" fill="#0d1117"/>
  <!-- Five squares on the diagonal. A square of side L rotated 45 degrees has a
       half-diagonal of L x 0.707, so the outer marks sit at distance
       12 + 7 = 19 from the centre: exactly touching it, as the real mark does.
       Building them from rotated rects keeps the corners exact. -->
  <g fill="#F0B90B">
    <rect x="27" y="8"    width="10" height="10" rx="1.4" transform="rotate(45 32 13)"/>
    <rect x="8"  y="27"   width="10" height="10" rx="1.4" transform="rotate(45 13 32)"/>
    <rect x="46" y="27"   width="10" height="10" rx="1.4" transform="rotate(45 51 32)"/>
    <rect x="27" y="46"   width="10" height="10" rx="1.4" transform="rotate(45 32 51)"/>
    <rect x="23.5" y="23.5" width="17" height="17" rx="2" transform="rotate(45 32 32)"/>
  </g>
</svg>
