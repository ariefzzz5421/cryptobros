<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="S&amp;P 500">
  <title>S&amp;P 500</title>
  <circle cx="32" cy="32" r="32" fill="#D6002A"/>
  <!-- One line, not two: at the 22px the ticker renders, stacked "S&P / 500"
       is illegible, and the row already prints "S&P 500" beside the mark. -->
  <text x="32" y="42" text-anchor="middle" fill="#fff"
        font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-1">S&amp;P</text>
</svg>
