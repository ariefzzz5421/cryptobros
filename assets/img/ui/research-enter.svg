<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="Open">
  <title>Open</title>
  <!-- Open-in-place glyph: a frame with an arrow leaving its top-right corner.
