    <path d="M18 14.25v3.9A2.85 2.85 0 0 1 15.15 21H5.85A2.85 2.85 0 0 1 3 18.15V8.85A2.85 2.85 0 0 1 5.85 6h3.9"/>
  </g>
</svg>
